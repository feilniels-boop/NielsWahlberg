<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      document.documentElement.classList.add("has-js");
    </script>
    <title>Free funnel plan | Niels Wahlberg</title>
    <meta
      name="description"
      content="Tell me what you sell and who buys it. I send you the funnel I would build for you, as a video. Five a week, free."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Free funnel plan | Niels Wahlberg" />
    <meta
      property="og:description"
      content="Tell me what you sell and who buys it. I send you the funnel I would build for you, as a video. Five a week, free."
    />
    <meta property="og:image" content="/hero-niels.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/form.css" />
  </head>
  <body class="page-form">
    <!-- Funnel-tracking (source funnel-en). Fejler den, kører formularen som før. -->
    <script src="/tracking.js"></script>
    <script>
      window.FeedbackFormConfig = {
        source: "funnel-en",
        redirectTo: "/en/thanks",
        homeHref: "/en",
        phoneMode: "intl",
        text: {
          brandName: "Niels Wahlberg",
          brandSubtitle: "Unedited",
          counterPrefix: "Question ",
          counterMid: " of ",
          sublineLast: "Last question",
          sublineLastTwo: "Last two questions",
          sublineHalf: "You're over halfway.",
          sublineContact: "Last step",
          btnNext: "Next",
          btnSend: "Send",
          btnBack: "← Back",
          hint: "Press Enter to continue.",
          hpLabel: "Do not fill in this field",
          scaleLow: "Not ready at all",
          scaleHigh: "Very ready",
          loading: "Sending …",
          submitError:
            "Something went wrong and your answers weren't sent. Check your connection and try again.",
          valChoice: "Choose an option to continue.",
          valTextarea: "Please write a short answer.",
          valScale: "Pick a number from {min} to {max}.",
        },
        contact: {
          heading: "Thanks for your answers.",
          subtext:
            "Your plan lands in your inbox in a few minutes. A video from me follows within 48 hours.",
          newsletterLabel:
            "Yes, send me my numbers every Monday: views, leads, calls booked.",
          newsletterRevealsEmail: false,
          fields: [
            {
              id: "name",
              type: "text",
              label: "Your name",
              placeholder: "e.g. Jonas",
              autocomplete: "name",
              msgRequired: "Enter your name.",
            },
            {
              id: "company",
              type: "text",
              label: "Company or website",
              placeholder: "e.g. acme.com",
              optional: true,
              autocomplete: "organization",
              payloadLabel: "Company / website",
            },
            {
              id: "email",
              type: "email",
              label: "Email",
              placeholder: "you@example.com",
              autocomplete: "email",
              msgRequired: "Enter your email.",
              msgInvalid: "Enter a valid email.",
            },
            {
              id: "phone",
              type: "tel",
              label: "Phone or WhatsApp",
              placeholder: "+45 12 34 56 78",
              optional: true,
              help: "optional, if you would rather get this as a voice note",
              autocomplete: "tel",
              msgInvalid: "Enter a valid phone number.",
            },
          ],
        },
        questions: [
          {
            id: "situation",
            type: "choice",
            question: "Where are you right now?",
            options: [
              { key: "A", label: "I have a business and clients, but nobody finds me online" },
              { key: "B", label: "I have a business, and every client comes from referrals" },
              { key: "C", label: "I run ads and I want a channel that costs less" },
              { key: "D", label: "I have something to sell and I have never posted" },
              { key: "E", label: "I haven't started anything yet" },
            ],
          },
          {
            id: "offer",
            type: "textarea",
            question: "What do you sell, and who buys it?",
            placeholder: "Keep it short …",
          },
          {
            id: "price",
            type: "choice",
            question: "What does it cost?",
            options: [
              { key: "A", label: "Under $500" },
              { key: "B", label: "$500 to $2,000" },
              { key: "C", label: "$2,000 to $10,000" },
              { key: "D", label: "Over $10,000" },
              { key: "E", label: "I am not selling anything yet" },
            ],
          },
          {
            id: "blocker",
            type: "textarea",
            question: "What has stopped you from posting?",
            placeholder: "Keep it short …",
          },
          {
            id: "readiness",
            type: "scale",
            question: "How ready are you, from 1 to 5, to invest in fixing this?",
            min: 1,
            max: 5,
          },
        ],
      };
    </script>
    <script src="/feedback-form.js"></script>
  </body>
</html>
