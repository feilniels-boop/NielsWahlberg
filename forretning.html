<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      document.documentElement.classList.add("has-js");
    </script>
    <title>Gratis funnel-plan | Niels Wahlberg</title>
    <meta
      name="description"
      content="Fortæl mig hvad du sælger, og hvem der køber det. Så sender jeg dig den funnel, jeg ville bygge til dig — som en video. Fem om ugen, gratis."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="da_DK" />
    <meta property="og:title" content="Gratis funnel-plan | Niels Wahlberg" />
    <meta
      property="og:description"
      content="Fortæl mig hvad du sælger, og hvem der køber det. Så sender jeg dig den funnel, jeg ville bygge til dig — som en video. Fem om ugen, gratis."
    />
    <meta property="og:image" content="/hero-niels.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/form.css" />
  </head>
  <body class="page-form">
    <!-- Funnel-tracking (source forretning-funnel). Fejler den, kører formularen som før. -->
    <script src="/tracking.js"></script>
    <script>
      window.FeedbackFormConfig = {
        source: "forretning-funnel",
        submitTo: "/api/quiz",
        redirectTo: "/forretning/tak",
        homeHref: "/",
        phoneMode: "dk",
        // Intro-skærmen er slået fra: links (fx fra YouTube) går direkte til
        // første spørgsmål. Sæt showIntro:true (eller fjern linjen) for at få
        // START-forsiden tilbage — intro-configen nedenfor bevares.
        showIntro: false,
        intro: {
          heading: "Jeg får kunder fra videoer med 200 visninger.",
          subline:
            "685 abonnenter på dansk, en median på 272 visninger pr. video på tværs af 263 videoer. Hver eneste kunde jeg har haft, kom fra indhold, og jeg har aldrig kørt en annonce.",
          bullets: [
            "den funnel jeg ville bygge til din forretning, lagt ud",
            "tre videotitler skrevet til din niche, ikke generiske",
            "en fire minutters video af mig, der går igennem det",
          ],
          ceiling: "Jeg laver fem af dem om ugen.",
          image: "/hero-niels.png",
          imageAlt: "Niels Wahlberg",
          button: "START",
          note: "tager cirka to minutter",
        },
        text: {
          brandName: "Niels Wahlberg",
          brandSubtitle: "Unedited",
          counterPrefix: "Spørgsmål ",
          counterMid: " af ",
          sublineLast: "Sidste spørgsmål",
          sublineLastTwo: "Sidste to spørgsmål",
          sublineHalf: "Du er over halvvejs",
          sublineContact: "Sidste skridt",
          btnNext: "Videre",
          btnSend: "Send",
          btnBack: "← Tilbage",
          hint: "Tryk Enter for at fortsætte.",
          hpLabel: "Udfyld ikke dette felt",
          scaleLow: "Slet ikke klar",
          scaleHigh: "Meget klar",
          loading: "Sender …",
          submitError:
            "Noget gik galt, og dine svar blev ikke sendt. Tjek din forbindelse og prøv igen.",
          valChoice: "Vælg en mulighed for at fortsætte.",
          valTextarea: "Skriv et kort svar.",
          valScale: "Vælg et tal fra {min} til {max}.",
        },
        contact: {
          heading: "Tak for dine svar.",
          subtext:
            "Din plan lander i din indbakke om få minutter. En video fra mig følger inden for 48 timer.",
          newsletterLabel:
            "Ja tak, send mig mine resultater og skriv mig op til dit nyhedsbrev.",
          newsletterRevealsEmail: false,
          newsletterRequired: true,
          newsletterMsgRequired:
            "Sæt flueben, så jeg må sende dig dine resultater.",
          fields: [
            {
              id: "name",
              type: "text",
              label: "Dit navn",
              placeholder: "fx Sarah",
              autocomplete: "name",
              msgRequired: "Skriv dit navn.",
            },
            {
              id: "company",
              type: "text",
              label: "Virksomhed eller hjemmeside",
              placeholder: "fx firma.dk",
              optional: true,
              autocomplete: "organization",
              payloadLabel: "Virksomhed / hjemmeside",
            },
            {
              id: "email",
              type: "email",
              label: "E-mail",
              placeholder: "dig@eksempel.dk",
              autocomplete: "email",
              msgRequired: "Skriv din e-mail.",
              msgInvalid: "Skriv en gyldig e-mail.",
            },
            {
              id: "phone",
              type: "tel",
              label: "Telefonnummer",
              placeholder: "",
              autocomplete: "tel",
              msgRequired: "Skriv dit telefonnummer.",
              msgInvalid: "Skriv et gyldigt dansk telefonnummer.",
            },
          ],
        },
        questions: [
          {
            id: "situation",
            type: "choice",
            question: "Hvor er du henne lige nu?",
            options: [
              { key: "A", label: "Jeg har en forretning og kunder, men ingen finder mig online" },
              { key: "B", label: "Jeg har en forretning, og alle kunder kommer via anbefalinger" },
              { key: "C", label: "Jeg kører annoncer og vil have en kanal der koster mindre" },
              { key: "D", label: "Jeg har noget at sælge og har aldrig postet" },
              { key: "E", label: "Jeg er ikke gået i gang med noget endnu" },
            ],
          },
          {
            id: "offer",
            type: "textarea",
            question: "Hvad sælger du, og hvem køber det?",
            placeholder: "Skriv kort …",
            rows: 2,
          },
          {
            id: "price",
            type: "choice",
            question: "Hvad koster dit produkt eller din ydelse?",
            options: [
              { key: "A", label: "Under 5.000 kr" },
              { key: "B", label: "5.000–20.000 kr" },
              { key: "C", label: "20.000–75.000 kr" },
              { key: "D", label: "Over 75.000 kr" },
              { key: "E", label: "Jeg sælger ikke noget endnu" },
            ],
          },
          {
            id: "blocker",
            type: "textarea",
            question: "Hvad har stoppet dig fra at poste?",
            placeholder: "Skriv kort …",
            rows: 2,
          },
          {
            id: "readiness",
            type: "scale",
            question: "Hvor klar er du til at få det her løst inden for 90 dage?",
            min: 1,
            max: 5,
          },
        ],
      };
    </script>
    <script src="/feedback-form.js"></script>
  </body>
</html>
