<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      document.documentElement.classList.add("has-js");
    </script>
    <title>Gratis forretningsfeedback | Niels Wahlberg Coaching</title>
    <meta
      name="description"
      content="Svar på 4 hurtige spørgsmål. Så sender Niels dig en personlig lydbesked med, hvor han ville starte hvis han var dig."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="da_DK" />
    <meta property="og:title" content="Gratis forretningsfeedback | Niels Wahlberg Coaching" />
    <meta
      property="og:description"
      content="Svar på 4 hurtige spørgsmål. Så sender Niels dig en personlig lydbesked med, hvor han ville starte hvis han var dig."
    />
    <meta property="og:image" content="/hero-niels.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="form.css" />
  </head>
  <body class="page-form">
    <script>
      window.FeedbackFormConfig = {
        source: "forretning",
        questions: [
          {
            id: "stage",
            type: "choice",
            question: "Hvor er du henne lige nu?",
            options: [
              { key: "A", label: "Jeg har en idé jeg ikke er kommet i gang med" },
              { key: "B", label: "Jeg er i gang, men har ikke solgt noget endnu" },
              { key: "C", label: "Jeg har solgt til de første, det vokser bare ikke" },
              { key: "D", label: "Jeg tjener fast, jeg vil have det op" },
              { key: "E", label: "Noget andet" },
            ],
          },
          {
            id: "idea",
            type: "textarea",
            question: "Hvad er den idé du ikke kan slippe?",
            placeholder: "Skriv kort …",
          },
          {
            id: "hours",
            type: "textarea",
            question: "Hvor mange timer om ugen har du til det de næste tre måneder?",
            placeholder: "Skriv kort …",
          },
          {
            id: "readiness",
            type: "scale",
            question: "Hvor klar er du fra 1 til 10 på at investere i at komme i gang?",
            min: 1,
            max: 10,
          },
        ],
      };
    </script>
    <script src="feedback-form.js"></script>
  </body>
</html>
